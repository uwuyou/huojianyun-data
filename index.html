<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火箭云数据服务</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif; background: #0a0e17; color: #e0e6ed; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: #141b2d; border: 1px solid #2a3454; border-radius: 12px; padding: 40px; max-width: 600px; width: 90%; }
h1 { color: #64b5f6; margin-bottom: 20px; font-size: 1.4rem; }
p { color: #8a9bb0; line-height: 1.8; margin-bottom: 12px; }
a { color: #64b5f6; text-decoration: none; }
a:hover { text-decoration: underline; }
.links { margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }
.link-item { background: #1a2340; border: 1px solid #2a3454; border-radius: 8px; padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 0.85rem; color: #8a9bb0; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
<h1>火箭云 · NOTAM 数据服务</h1>
<p>本仓库由 GitHub Actions 每 30 分钟自动抓取 DAIP + FAA NOTAM 数据，生成预测和历史 JSON 文件，通过 GitHub Pages 对外提供。</p>
<p>前端网站 <a href="https://huojianyun.netlify.app">huojianyun.netlify.app</a> 直接读取以下 JSON 文件：</p>
<div class="links">
<div class="link-item">/data/prediction.json — 未来发射预测（含落区坐标 + 航迹 path）</div>
<div class="link-item">/data/history.json — 历史发射归档</div>
<div class="link-item">/data/status.json — 同步状态（数据源、时间、记录数）</div>
</div>
</div>
</body>
</html>
